<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Goldbook 本地研究{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}">Goldbook · 黄金观点研究</a>
    <nav aria-label="主导航"><a href="{{ url_for('leaderboard') }}">历史信号统计</a></nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>仅供本地研究与复盘，不构成投资建议。</footer>
  <script src="{{ url_for('static', filename='chart.umd.min.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
